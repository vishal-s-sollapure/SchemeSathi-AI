services:
  - type: web
    name: schemesathi-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: SchemeSathi AI
      - key: VERSION
        value: 0.1.0
      - key: BACKEND_CORS_ORIGINS
        value: "https://schemesathi-ai.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: schemesathi-postgres
          property: connectionString
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "15728640"
      - key: DEFAULT_LANGUAGE
        value: "en"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: schemesathi-postgres
    databaseName: schemesathi
    user: schemesathi_user
    plan: free
